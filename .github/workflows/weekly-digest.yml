name: Weekly Tech Digest

on:
  schedule:
    # Runs every Friday at 8:00 PM UTC — adjust for your timezone!
    - cron: "*/5 * * * *"  #"0 20 * * 5"
  workflow_dispatch: # lets you manually trigger it from GitHub's UI too

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
        run: node scripts/run.js


# */2  *  *  *  *
#  │    │  │  │  │
#  │    │  │  │  └── Day of week
#  │    │  │  └──── Month
#  │    │  └────── Day of month
#  │    └──────── Hour
#  └───────────── Every 2 minutes